services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zafoor
      POSTGRES_PASSWORD: zafoor_password
      POSTGRES_DB: zafoor_clinic
    ports:
      - "5432:5432"
    volumes:
      - zafoor_clinic_db:/var/lib/postgresql/data

volumes:
  zafoor_clinic_db:
